<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="Style2.css">
<style>
/* Kalender-Navigation */
.mhead,.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h1{margin:0}
.navs{display:flex;align-items:center;gap:6px}
.nav,.todayBtn{border:0;border-radius:999px;background:rgba(0,0,0,.06);cursor:pointer;font:inherit;color:inherit}
.nav{width:32px;height:32px;font-size:20px;line-height:1}
.todayBtn{padding:6px 14px;font-weight:600}
.nav:hover,.todayBtn:hover{background:rgba(0,0,0,.12)}
#mini td{cursor:pointer}
#mini td.out{opacity:.35}
#mini td.wk{background:rgba(185,182,255,.35)}
#mini td:hover{outline:1px solid rgba(0,0,0,.2)}
.days .today{color:#6c63ff}
.days .today b{background:#6c63ff;color:#fff;border-radius:999px;padding:0 6px}
.grid .c.now{background:rgba(185,182,255,.12)}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <div class="side" id="side"></div>
  <div class="mid">
    <div class="mini">
      <div class="mhead"><button class="nav" id="mPrev" type="button" aria-label="Vorheriger Monat">‹</button><b id="mTitle"></b><button class="nav" id="mNext" type="button" aria-label="Nächster Monat">›</button></div>
      <table id="mini"></table>
    </div>
    <section class="todo" aria-label="To-Do">
      <h2 id="todoTitle"></h2>
      <ul id="list"></ul>
      <button class="btn" id="open" type="button">+ Hinzufügen</button>
      <div class="form" id="form" role="group" aria-label="Neues To-Do">
        <label>Datum<input type="date" id="date"></label>
        <label>Uhrzeit<input type="time" id="time"></label>
        <label>Was möchtest du machen?<input type="text" id="what" maxlength="40" placeholder="z. B. Deutsch lernen"></label>
        <div class="err" id="err" role="alert"></div>
        <div class="btns"><button class="btn" id="save" type="button">Hinzufügen</button><button class="ghost" id="cancel" type="button">Abbrechen</button></div>
      </div>
    </section>
  </div>
  <section class="cal" id="cal">
    <div class="calhead">
      <h1 id="calTitle"></h1>
      <div class="navs">
        <button class="nav" id="wPrev" type="button" aria-label="Zurück">‹</button>
        <button class="todayBtn" id="today" type="button">Heute</button>
        <button class="nav" id="wNext" type="button" aria-label="Weiter">›</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="days" id="days"></div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="auth" id="auth">
  <div class="frame">
    <button class="close" id="closeAuth" type="button" aria-label="Schließen">×</button>
    <form class="card" id="authForm" novalidate>
      <h1>Anmeldung</h1>
      <p class="sub">Schön, dass du wieder da bist.</p>

      <label for="aMail">E-Mail</label>
      <input id="aMail" type="email" autocomplete="email">

      <label for="aPw">Passwort</label>
      <input id="aPw" type="password" autocomplete="current-password">

      <div class="err" id="aErr" role="alert"></div>
      <button class="btn" type="submit">Anmelden</button>
      <div class="switch"><a class="btn2" href="register.html">Registrieren</a></div>
      <p class="hint">Zum Ausprobieren: tom@beispiel.at / tom123 oder mia@beispiel.at / mia123</p>
    </form>
  </div>
</div>

<script src="daten.js"></script>
<script src="java.js"></script>
</body>
</html>
