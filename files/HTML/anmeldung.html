<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth"><div class="authbox"><div class="authin">
  <h1>Anmeldung:</h1>
  <p id="pend" class="hint hidden" style="color:#dfeee9">Nach dem Anmelden trittst du dem eingeladenen Kalender bei.</p>
  <label for="em">E-Mail:</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Passwort:</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="err" role="alert"></div>
  <button class="btn" id="go">Anmelden</button>
  <a class="link" href="registrierung.html">Noch kein Konto? Registrieren</a>
</div></div></div>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/anmeldung.js"></script>
</body>
</html>
